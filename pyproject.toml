[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "exec-impact"
version = "0.1.0"
description = "Market impact calibration and optimal execution (Almgren-Chriss vs TWAP/VWAP) on crypto tick data"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Quant Research Team" }
]
dependencies = [
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "polars>=0.20.0",
    "pyarrow>=16.0.0",
    "scipy>=1.13.0",
    "statsmodels>=0.14.0",
    "pyyaml>=6.0.0",
    "requests>=2.31.0",
    "tqdm>=4.66.0",
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line length handled by formatter
    "B008",  # do not perform function calls in argument defaults
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --strict-markers"
